version: '3'

vars:
  DIST_DIR: '{{.ROOT_DIR}}/out'
  GIT_COMMIT:
    # `|| echo unknown` keeps the build working inside the container, where a
    # bind-mounted repo can trip git's "dubious ownership" check.
    sh: git log -n 1 --format=%h 2>/dev/null || echo unknown
  BUILD_DATE:
    sh: date '+%Y-%m-%d'
  # Formats built by `build` / `build-all`, produced natively by ebook-cli
  # (no Calibre / ebook-convert): EPUB, PDF (via Typst) and MDX. Override per
  # run, e.g. `task build-all FORMATS=epub,pdf`.
  FORMATS: epub,pdf,mdx
  BOOK_PROJECTS: |
    src/txt/lang-notes/fas
    src/txt/lang-notes/heb
    src/txt/lang-notes/tur

tasks:

  build:
    desc: Build the book in the current directory (epub, pdf, mdx)
    cmds:
      - task: build-book
        vars:
          WORKING_DIR: '{{.USER_WORKING_DIR}}'

  build-all:
    desc: Build all books (epub, pdf, mdx)
    cmds:
      - for: { var: BOOK_PROJECTS }
        task: build-book
        vars:
          WORKING_DIR: '{{.ITEM}}'

  build-book:
    desc: Build one book project into the configured formats
    internal: true
    silent: true
    dir: '{{.WORKING_DIR}}'
    preconditions:
      - test -f ebook.yml
    requires:
      vars:
        - WORKING_DIR
        - DIST_DIR
        - BUILD_DATE
        - GIT_COMMIT
        - FORMATS
    cmds:
      - cmd: echo 'Building {{.WORKING_DIR}} ({{.FORMATS}}) ...'
      - cmd: |
          xmlstarlet edit --inplace -N x=http://www.w3.org/2000/svg \
            --update "//x:text[@id='date']" --value "{{.BUILD_DATE}}" \
            --update "//x:text[@id='version']" --value "{{.GIT_COMMIT}}" \
            cover.svg
      # EPUB, PDF (Typst) and MDX in one pass — replaces the old
      # `ebook-cli build` + Calibre `ebook-convert` two-step.
      - cmd: ebook-cli build --format {{.FORMATS}}
      - cmd: |
          set -e
          mkdir -p "{{.DIST_DIR}}"
          echo "Collecting output into {{.DIST_DIR}} ..."
          # EPUB / PDF files.
          for f in *.epub *.pdf; do
            [ -f "$f" ] || continue
            mv -f "$f" "{{.DIST_DIR}}/"
          done
          # MDX output directories (<name>-mdx/); replace any previous copy.
          for d in *-mdx; do
            [ -d "$d" ] || continue
            rm -rf "{{.DIST_DIR}}/${d}"
            mv "$d" "{{.DIST_DIR}}/"
          done
          # Drop the intermediate Typst source ebook-cli leaves next to the PDF.
          rm -f *.typ
